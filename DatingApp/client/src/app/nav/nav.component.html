<nav class="navbar navbar-expand-md navbar-dark fixed-top bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Dating App</a>

    @if(loggedIn)
    {
    <ul class="navbar-nav me-auto mb-2 mb-md-0">
      <li class="nav-item">
        <a class="nav-link" aria-current="page" href="#">Matches</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" aria-current="page" href="#">Lists</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" aria-current="page" href="#">Messages</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" aria-current="page" href="#" (click)="logout()">Logout</a>
      </li>

    </ul>
    }

    @if (loggedIn) {
      <div dropdown class="dropdown">
        
        <a dropdownToggle class="dropdown-toggle text-light text-decoration-none">Welcome user</a>
       
        <div *dropdownMenu class="dropdown-menu">
          <a class="dropdown-item">Edit Profile</a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item" (click)="logout()">Logout</a>
        </div>

      </div>
    }

    <form #loginForm="ngForm" (ngSubmit)="login()" autocomplete="off" class="d-flex" *ngIf="!loggedIn">
      <input name="Username" [(ngModel)]="model.Username" class="form-control me-2" placeholder="User Name">

      <input name="password" [(ngModel)]="model.password" class="form-control me-2" type="password"
        placeholder="Password">

      <button class="btn btn-outline-success" type="submit">Login</button>
    </form>


  </div>

</nav>
